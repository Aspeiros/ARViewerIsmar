<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ISMAR 2026 · AR Marker & QR Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Tsukimi+Rounded:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root { font-family: Poppins, Arial, sans-serif; color: #3d1209; background: #f4e8d4; }
      * { box-sizing: border-box; } body { margin: 0; min-width: 320px; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 86% 12%, #fff0b3, transparent 28%), linear-gradient(145deg, #f7d3cb, #f4e8d4 60%, #fff0b3); }
      .card { width: min(600px, 100%); padding: clamp(24px, 5vw, 44px); text-align: center; border: 2px solid #3d1209; border-radius: 25px; background: #fffdf8ee; box-shadow: 8px 8px 0 #3d1209; }
      img.logo { width: min(280px, 80%); margin-bottom: 16px; }
      h1 { margin: 0 0 10px; font: 700 clamp(26px, 5vw, 40px)/1.1 "Tsukimi Rounded", Poppins, sans-serif; }
      p.subtitle { max-width: 460px; margin: 0 auto 20px; line-height: 1.5; font-size: 15px; }
      .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
      .control-group { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 12px; font-weight: 600; }
      select { padding: 8px 14px; border: 2px solid #3d1209; border-radius: 10px; background: white; font-family: inherit; font-size: 14px; font-weight: 600; color: #3d1209; cursor: pointer; }
      #qr { display: grid; place-items: center; width: min(300px, 76vw); aspect-ratio: 1; padding: 16px; margin: 10px auto 14px; border: 10px solid #ffe000; border-radius: 16px; background: white; box-shadow: 4px 4px 0 #3d1209; }
      #qr img, #qr canvas { width: 100%; height: 100%; margin: 0; image-rendering: pixelated; }
      .url { overflow-wrap: anywhere; color: #006df2; font-size: 13px; font-weight: 600; margin: 8px 0; }
      .actions { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
      .btn { padding: 9px 18px; border: 2px solid #3d1209; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; background: #ffe000; box-shadow: 3px 3px 0 #3d1209; }
      .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #3d1209; }
      .tip { margin-top: 18px; margin-bottom: 0; font-size: 12px; font-weight: 500; opacity: 0.8; }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <img class="logo" src="./GraphicResources/Banners_&_logo/Logo_&_wordmark.svg" alt="ISMAR 2026" />
        <h1>AR Marker & QR Generator</h1>
        <p class="subtitle">Select the destination station and language, test on screen or export the QR for conference posters.</p>

        <div class="controls">
          <div class="control-group">
            <label for="content-select">Venue Station:</label>
            <select id="content-select">
              <option value="welcome" selected>Welcome to Bari (General)</option>
              <option value="food">Taste Puglia (Gastronomy)</option>
              <option value="venue">Explore Venue (Conference Hall)</option>
            </select>
          </div>
          <div class="control-group">
            <label for="lang-select">Preset Language:</label>
            <select id="lang-select">
              <option value="en" selected>English 🇬🇧 (Default)</option>
              <option value="it">Italiano 🇮🇹</option>
              <option value="de">Deutsch 🇩🇪</option>
              <option value="es">Español 🇪🇸</option>
              <option value="fr">Français 🇫🇷</option>
              <option value="zh">中文 🇨🇳</option>
              <option value="ja">日本語 🇯🇵</option>
              <option value="ko">한국어 🇰🇷</option>
            </select>
          </div>
        </div>

        <div id="qr" aria-label="QR Code"></div>
        <p class="url" id="url"></p>

        <div class="actions">
          <button class="btn" id="download-btn" type="button">Download High-Res QR</button>
        </div>

        <p class="tip">Tip: Scan with your smartphone, tap "Open camera", and aim back at this QR code.</p>
      </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
      const qrContainer = document.querySelector('#qr');
      const urlText = document.querySelector('#url');
      const contentSelect = document.querySelector('#content-select');
      const langSelect = document.querySelector('#lang-select');
      const downloadBtn = document.querySelector('#download-btn');
      let qrInstance = null;

      function updateQR() {
        const basePath = window.location.pathname.replace(/\/test\.html.*$/, '/');
        const content = contentSelect.value;
        const lang = langSelect.value;
        const destination = `${window.location.origin}${basePath}?content=${content}&lang=${lang}`;

        urlText.textContent = destination;
        qrContainer.innerHTML = '';
        qrInstance = new QRCode(qrContainer, {
          text: destination,
          width: 512,
          height: 512,
          correctLevel: QRCode.CorrectLevel.H
        });
      }

      contentSelect.addEventListener('change', updateQR);
      langSelect.addEventListener('change', updateQR);

      downloadBtn.addEventListener('click', () => {
        const img = qrContainer.querySelector('img');
        const canvas = qrContainer.querySelector('canvas');
        const source = img?.src || canvas?.toDataURL('image/png');
        if (!source) return;
        const a = document.createElement('a');
        a.href = source;
        a.download = `ISMAR2026-QR-${contentSelect.value}-${langSelect.value}.png`;
        a.click();
      });

      updateQR();
    </script>
  </body>
</html>
